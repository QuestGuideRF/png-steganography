<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1216">
  <title>404 | PNG Стеганография</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#0f1216;
      color:#f2f5f7;
      font:16px/1.6 "Segoe UI",Tahoma,Arial,sans-serif;
      padding:18px
    }
    .card{
      width:min(100%,620px);
      padding:28px;
      border:1px solid #2c3540;
      border-radius:24px;
      background:#171b21;
      box-shadow:0 14px 32px rgba(0,0,0,.22)
    }
    .badge{
      display:inline-flex;
      padding:8px 12px;
      border-radius:999px;
      background:#1f2630;
      border:1px solid #2c3540;
      font-size:.86rem;
      font-weight:700;
      text-transform:uppercase
    }
    h1{margin:16px 0 10px;font-size:2rem;line-height:1.1}
    p{margin:0;color:#aab4c0}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      background:#3c7cff;
      color:#fff;
      text-decoration:none;
      font-weight:700
    }
    .button--secondary{
      background:#1d232b;
      border:1px solid #2c3540;
      color:#f2f5f7
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Ошибка 404</span>
    <h1>Страница не найдена</h1>
    <p>Похоже, адрес изменился или страница отсутствует. Вернитесь на главную, чтобы снова открыть инструмент стеганографии.</p>
    <div class="actions">
      <a class="button" href="/">На главную</a>
      <a class="button button--secondary" href="/500.html">Открыть страницу 500</a>
    </div>
  </main>
</body>
</html>
